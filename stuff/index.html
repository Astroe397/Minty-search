<!DOCTYPE html>
<html>
<head>
    <link rel="icon" type="image/png" href="/favicon.png">
    <title>Minty Tech News</title>
    <link rel="stylesheet" href="style.css">
    <script type="text/javascript" src="/eel.js"></script>
</head>
<body>
    <header class="header-card">
        <div class="brand-info">
            <img src="icon.png" alt="Minty Logo" class="brand-logo">
            <H1>Minty works for all people</H1>
        </div>
    <button class="btn-primary" onclick="sendToPython()">Wake up the world</button>
    </header>

    <main class="content-card">
        <div id="response"></div>
    </main>

    <script>
        function sendToPython() {
            document.getElementById('response').innerText = "Looking around the globe...";
            
            eel.process_data()(function(result) {
                // FIXED: Changed innerText to innerHTML
                document.getElementById('response').innerHTML = result; 
            });
        }
    </script>
</body>
</html>
